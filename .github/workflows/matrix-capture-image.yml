name: Matrix Capture Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version (MAJOR.MINOR.PATCH); tag becomes <version>-<sha7>"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: matrix-capture-image-${{ inputs.version }}-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/evangineer/ob1-matrix-capture

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive immutable tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must match ^[0-9]+\.[0-9]+\.[0-9]+\$ (got: $VERSION)"
            exit 1
          fi
          echo "TAG=${VERSION}-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if tag already exists
        run: |
          set -euo pipefail
          ref="${IMAGE}:${TAG}"
          rc=0
          err="$(docker manifest inspect "$ref" 2>&1 >/dev/null)" || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::tag exists: $ref (tags are immutable; bump the version or commit)"
            exit 1
          fi
          # Absent tag (observed): existing package -> "manifest unknown"; also accept
          # MANIFEST_UNKNOWN / "no such manifest" / "name unknown" (case-insensitive).
          # Never-pushed package anonymously gives "denied" and is NOT matched (fails).
          if printf '%s' "$err" | grep -qiE 'manifest unknown|no such manifest|name unknown'; then
            echo "Tag $ref absent from registry; continuing."
            exit 0
          fi
          echo "::error::unexpected error checking $ref: $err"
          exit 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: integrations/matrix-capture/package-lock.json

      - name: Install and test
        working-directory: integrations/matrix-capture
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: integrations/matrix-capture
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Write summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "## Matrix capture image"
            echo ""
            echo "- Tag: \`${IMAGE}:${TAG}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Pinned ref: \`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
